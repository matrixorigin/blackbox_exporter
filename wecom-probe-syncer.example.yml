sync_interval: 1m

wecom:
  corpid_file: /etc/wecom-probe-syncer/secrets/corpid
  corpsecret_file: /etc/wecom-probe-syncer/secrets/corpsecret
  docid: "replace-with-wecom-document-id"
  sheet_ids:
    - "replace-with-smart-sheet-id"
    - "replace-with-another-smart-sheet-id"
  key_type: CELL_VALUE_KEY_TYPE_FIELD_TITLE
  page_size: 100

kubernetes:
  namespace: mo-ob
  field_manager: wecom-probe-syncer
  prober_url: ai-vllm-blackbox-exporter.mo-ob.svc:9115
  prober_path: /probe
  name_prefix: wecom
  release_label: mo-ob-opensource-tke
  prune: true

defaults:
  module: tcp_connect
  interval: 30s
  scrape_timeout: 10s

columns:
  enabled: enabled
  module: module
  target: target

default_labels:
  source: wecom-smartsheet

allowed_modules:
  - http_2xx
  - http_2xx_3xx_no_redirect
  - tcp_connect
  - icmp
  - ssh_banner
