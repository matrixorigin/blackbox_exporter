---
name: Build wecom_probe_syncer image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: shanghai.idc.matrixorigin.cn:30019
  IMAGE_NAMESPACE: mocloud
  IMAGE_NAME: wecom-probe-syncer
  GO_VERSION: "1.26"

jobs:
  build-and-push:
    name: Build and push wecom_probe_syncer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Shanghai Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SHANGHAI_HARBOR_CI_USERNAME }}
          password: ${{ secrets.SHANGHAI_HARBOR_CI_PASSWORD }}

      - name: Prepare image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y%m%d)"
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${version}-${short_sha}-${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wecom-probe-syncer
          platforms: linux/amd64
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
